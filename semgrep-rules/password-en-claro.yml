rules:
  - id: password-bd-en-claro
    languages: [generic]
    severity: ERROR
    message: "Contraseña de base de datos escrita en claro en un archivo de configuracion versionado. Usar variable de entorno o un gestor de secretos."
    pattern-regex: '(?m)^\s*spring\.datasource\.password\s*=\s*(?!\$\{)\S+'
    paths:
      include:
        - "*.properties"
    metadata:
      cwe: "CWE-798: Use of Hard-coded Credentials"
      category: security